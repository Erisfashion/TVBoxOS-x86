apply plugin: 'com.android.library'

android {
    compileSdkVersion 30
    buildToolsVersion "30.0.3"

    defaultConfig {
        minSdkVersion 17
        targetSdkVersion 28

        ndk {
            abiFilters "x86"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.2.0'
    
    // OkHttp 网络依赖
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'

    // 仅在运行时注入 x86 解码动态库，避免与 player 模块自带的 IJK 源码类冲突
    runtimeOnly('tv.danmaku.ijk.media:ijkplayer-x86:0.8.8') {
        exclude group: 'tv.danmaku.ijk.media', module: 'ijkplayer-java'
    }

    // 对齐源码所依赖的 ExoPlayer 2.14.2 模块
    api 'com.google.android.exoplayer:exoplayer-core:2.14.2'
    api 'com.google.android.exoplayer:exoplayer-dash:2.14.2'
    api 'com.google.android.exoplayer:exoplayer-hls:2.14.2'
    api 'com.google.android.exoplayer:extension-rtmp:2.14.2'
}
