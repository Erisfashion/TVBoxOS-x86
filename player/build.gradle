apply plugin: 'com.android.library'

android {
    compileSdkVersion 33

    defaultConfig {
        minSdkVersion 17
        targetSdkVersion 28
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'x86'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.2.0'

    implementation 'com.squareup.okhttp3:okhttp:3.12.13'

    // 1. ijkplayer 基础与 x86 SO 动态库
    implementation 'tv.danmaku.ijk.media:ijkplayer-java:0.8.8'
    implementation 'tv.danmaku.ijk.media:ijkplayer-x86:0.8.8'

    // 2. 补齐 dkplayer UI 资源库（解决所有 dkplayer_ 资源找不到报错）
    implementation 'xyz.doikki.android.dkplayer:dkplayer-ui:3.3.7'

    // 3. ExoPlayer 2.18.7 全套（追加 exoplayer-ui 解决 exo_icon_play 等资源缺失报错）
    def exo_version = '2.18.7'
    implementation "com.google.android.exoplayer:exoplayer-core:${exo_version}"
    implementation "com.google.android.exoplayer:exoplayer-ui:${exo_version}"
    implementation "com.google.android.exoplayer:exoplayer-dash:${exo_version}"
    implementation "com.google.android.exoplayer:exoplayer-hls:${exo_version}"
    implementation "com.google.android.exoplayer:exoplayer-rtsp:${exo_version}"
    implementation "com.google.android.exoplayer:extension-rtmp:${exo_version}"
}
