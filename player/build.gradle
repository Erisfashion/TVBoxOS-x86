apply plugin: 'com.android.library'

android {
    compileSdkVersion 33

    defaultConfig {
        minSdkVersion 17
        targetSdkVersion 28
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'x86'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.2.0'

    implementation 'com.squareup.okhttp3:okhttp:3.12.13'

    // ijkplayer 原生库
    api 'tv.danmaku.ijk.media:ijkplayer-java:0.8.8'
    api 'tv.danmaku.ijk.media:ijkplayer-x86:0.8.8'

    // dkplayer UI 库
    implementation 'xyz.doikki.android.dkplayer:dkplayer-ui:3.3.7'

    // 关键：将 ExoPlayer 改为 api 导出，让 app 模块能正常继承和访问 Player 接口
    def exo_version = '2.18.7'
    api "com.google.android.exoplayer:exoplayer-core:${exo_version}"
    api "com.google.android.exoplayer:exoplayer-ui:${exo_version}"
    api "com.google.android.exoplayer:exoplayer-dash:${exo_version}"
    api "com.google.android.exoplayer:exoplayer-hls:${exo_version}"
    api "com.google.android.exoplayer:exoplayer-rtsp:${exo_version}"
    api "com.google.android.exoplayer:extension-rtmp:${exo_version}"
}
