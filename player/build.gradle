apply plugin: 'com.android.library'

android {
    compileSdkVersion 30
    buildToolsVersion "30.0.3"

    defaultConfig {
        minSdkVersion 17
        targetSdkVersion 28

        ndk {
            abiFilters "x86"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.2.0'
    
    // OkHttp 网络依赖
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'

    // x86 原生解码支持 (排除 ijkplayer-java，防止与本地 IJK 源码冲突)
    implementation('tv.danmaku.ijk.media:ijkplayer-x86:0.8.8') {
        exclude group: 'tv.danmaku.ijk.media', module: 'ijkplayer-java'
    }

    // ExoPlayer 2.11.8 (与本地 HlsErrorHandlingPolicy 源码完全对齐)
    api 'com.google.android.exoplayer:exoplayer:2.11.8'
    api 'com.google.android.exoplayer:extension-rtmp:2.11.8'
}
