apply plugin: 'com.android.library'

android {
    compileSdkVersion 30

    defaultConfig {
        minSdkVersion 17
        targetSdkVersion 28
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'x86'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.2.0'

    // 解决 OkHttpDataSource 与 ExoMediaSourceHelper 找不到 okhttp3 的报错
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'

    // ijkplayer 及其 x86 软硬解 SO 动态库
    implementation 'tv.danmaku.ijk.media:ijkplayer-java:0.8.8'
    implementation 'tv.danmaku.ijk.media:ijkplayer-x86:0.8.8'

    // ExoPlayer 2.18.7（与源码中的 PlaybackException/Player.Listener 等符号完全匹配）
    def exo_version = '2.18.7'
    implementation "com.google.android.exoplayer:exoplayer-core:${exo_version}"
    implementation "com.google.android.exoplayer:exoplayer-dash:${exo_version}"
    implementation "com.google.android.exoplayer:exoplayer-hls:${exo_version}"
    implementation "com.google.android.exoplayer:exoplayer-rtsp:${exo_version}"
    implementation "com.google.android.exoplayer:extension-rtmp:${exo_version}"
}
