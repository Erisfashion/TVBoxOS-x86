apply plugin: 'com.android.library'

android {
    compileSdkVersion 30
    buildToolsVersion "30.0.3"

    defaultConfig {
        minSdkVersion 17
        targetSdkVersion 28

        ndk {
            abiFilters "x86"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.2.0'
    
    // 补齐 OkHttpDataSource.java 所需的网络库
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'

    // 引入 x86 解码库，并排除 java 依赖（防止与 player 自带的 IjkMediaPlayer 源码冲突）
    implementation('tv.danmaku.ijk.media:ijkplayer-x86:0.8.8') {
        exclude group: 'tv.danmaku.ijk.media', module: 'ijkplayer-java'
    }

    // 必须使用 2.11.8：与 player 源码中的 HlsErrorHandlingPolicy 完全匹配
    api 'com.google.android.exoplayer:exoplayer-core:2.11.8'
    api 'com.google.android.exoplayer:exoplayer-dash:2.11.8'
    api 'com.google.android.exoplayer:exoplayer-hls:2.11.8'
    api 'com.google.android.exoplayer:extension-rtmp:2.11.8'

    // 引入 DKPlayer UI 依赖（提供 box_vod_control_view 所需的 dkplayer_* 资源及 center_container）
    api 'xyz.doikki.videoplayer:videoplayer-ui:3.3.7'
}
