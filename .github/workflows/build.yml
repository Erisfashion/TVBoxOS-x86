name: Build TVBox Android 4.2 x86 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # 关键步骤：生成 local.properties 注入 SDK 路径
      - name: Create local.properties
        run: |
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # 核心优化：限制 max-workers=2 避免服务器内存暴涨触发 OOM
      - name: Build Debug APK
        run: ./gradlew clean :app:assembleDebug --stacktrace --max-workers=2

      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxOS-Android4.2.2-x86-Tablet
          path: app/build/outputs/apk/**/*.apk
          retention-days: 7
