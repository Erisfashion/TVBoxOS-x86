buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.1.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://jitpack.io' }
    }
}

// 全局禁用 AAR 元数据检查，解决部分第三方库声明了更高 minSdk 导致的强校验拦截
subprojects {
    afterEvaluate { project ->
        project.tasks.all { task ->
            if (task.name.contains("AarMetadata")) {
                task.enabled = false
            }
        }
    }
}
// 强制所有子模块统一使用 API 17 与编译参数
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            android {
                defaultConfig {
                    minSdkVersion 17
                }
            }
        }
    }
}
