apply plugin: 'com.android.application'

android {
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.github.tvbox.osc"
        minSdkVersion 17
        targetSdkVersion 28
        versionCode 100
        versionName "1.0.0-x86-jb"
        multiDexEnabled true

        ndk {
            abiFilters "x86"
        }

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        pickFirst 'lib/x86/libijkplayer.so'
        pickFirst 'lib/x86/libijkffmpeg.so'
        pickFirst 'lib/x86/libijksdl.so'
        exclude 'META-INF/beans.xml'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation project(':player')
    implementation project(':quickjs')
    implementation project(':tvrecyclerview')

    // 权限申请库
    implementation 'com.github.getActivity:XXPermissions:11.6'

    // 文本编码识别
    implementation 'com.googlecode.juniversalchardet:juniversalchardet:1.0.3'

    // XML 解析与弹幕组件
    implementation ('com.thoughtworks.xstream:xstream:1.4.18') {
        exclude group: 'xmlpull', module: 'xmlpull'
    }
    implementation 'com.github.ctiao:DanmakuFlameMaster:0.9.25'

    // 注解支持
    implementation 'org.jetbrains:annotations:13.0'

    // Android 4.2.2 启动必备分包支持
    implementation 'androidx.multidex:multidex:2.0.1'

    // AndroidX UI 基础套件
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.2.1'

    // 屏幕适配与列表适配器 (2.x 版本)
    implementation 'me.jessyan:autosize:1.2.1'
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.50'

    // Room 数据库组件
    implementation 'androidx.room:room-runtime:2.2.5'
    annotationProcessor 'androidx.room:room-compiler:2.2.5'

    // 图片加载 (Glide 与 Picasso 2.71828)
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0'
    implementation 'com.squareup.picasso:picasso:2.71828'

    // 网络依赖 (移除了重复的 okhttp-dnsoverhttps 外部包，直接使用源码中的实现)
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'com.lzy.net:okgo:3.0.4'

    // 常用工具与本地服务 (移除了重复的 commons-io，本地已有对应类)
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'org.greenrobot:eventbus:3.2.0'
    implementation 'org.jsoup:jsoup:1.13.1'
    implementation 'com.google.zxing:core:3.4.1'
    implementation 'com.orhanobut:hawk:2.0.1'
    implementation 'com.kingja.loadsir:loadsir:1.3.8'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
